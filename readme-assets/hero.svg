<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img">
  <title>Meridian MCP</title>
  <desc>Time, wherever you are. Remote time awareness for AI companions.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#21262D" stroke-width="1" opacity=".7"/>
    </pattern>
    <style>
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; letter-spacing: 6px; }
      .headline { font: 800 64px 'Segoe UI', Arial, sans-serif; letter-spacing: 0; }
      .copy { font: 400 24px 'Segoe UI', Arial, sans-serif; letter-spacing: 0; }
      .micro { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 3px; }
      .minute { animation: spin 12s linear infinite; transform-origin: 914px 208px; }
      .hour { animation: spin 36s linear infinite; transform-origin: 914px 208px; }
      .orbit { stroke-dasharray: 12 16; animation: orbit 8s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .reveal { animation: reveal 1.1s ease-out both; }
      .reveal.two { animation-delay: .16s; }
      .reveal.three { animation-delay: .32s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes orbit { to { stroke-dashoffset: -224; } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.84); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .minute, .hour, .orbit, .pulse, .reveal { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="22" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="416" rx="21" fill="url(#grid)"/>
  <path d="M38 78H650M38 345H1162" stroke="#30363D"/>

  <g class="reveal">
    <text x="58" y="57" class="label" fill="#8B949E">MERIDIAN / A VALE ATELIER PROJECT</text>
    <rect x="610" y="43" width="8" height="8" transform="rotate(45 610 43)" fill="#39D0C3"/>
  </g>

  <g class="reveal two">
    <text x="56" y="166" class="headline" fill="#F0F6FC">TIME,</text>
    <text x="56" y="239" class="headline" fill="#F0F6FC">WHEREVER <tspan fill="#39D0C3">YOU ARE.</tspan></text>
  </g>

  <g class="reveal three">
    <text x="59" y="296" class="copy" fill="#B8C0CC">One remote MCP deployment.</text>
    <text x="59" y="328" class="copy" fill="#B8C0CC">Desktop, browser, and mobile.</text>
  </g>

  <g>
    <circle cx="914" cy="208" r="129" stroke="#30363D" stroke-width="2"/>
    <circle cx="914" cy="208" r="112" class="orbit" stroke="#39D0C3" stroke-width="2" opacity=".72"/>
    <circle cx="914" cy="208" r="88" stroke="#484F58" stroke-width="1"/>

    <path d="M914 91V111M914 305V325M797 208H817M1011 208H1031" stroke="#8B949E" stroke-width="3"/>
    <path d="M831 125L843 137M985 279L997 291M831 291L843 279M985 137L997 125" stroke="#484F58" stroke-width="2"/>

    <g class="hour">
      <path d="M914 208V153" stroke="#F2CC60" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g class="minute">
      <path d="M914 208V121" stroke="#39D0C3" stroke-width="4" stroke-linecap="round"/>
      <path d="M914 208V232" stroke="#39D0C3" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    </g>

    <g class="pulse">
      <rect x="904" y="198" width="20" height="20" transform="rotate(45 914 208)" fill="#FF6B4A" opacity=".28"/>
      <rect x="909" y="203" width="10" height="10" transform="rotate(45 914 208)" fill="#F2CC60"/>
    </g>

    <text x="870" y="385" class="micro" fill="#8B949E">UTC / LOCAL</text>
    <path d="M1046 377H1138" stroke="#39D0C3" stroke-width="2"/>
  </g>
</svg>
